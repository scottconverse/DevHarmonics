name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        # Required since slice 5 introduced the repo's first real dependency
        # (@agentclientprotocol/sdk); the zero-dep era needed no install.
        run: npm ci
      - name: Syntax + full test suite
        run: npm run check
      - name: Doctor smoke — completes honestly on a machine with nothing installed
        # Runners have no provider CLIs or local model servers. Doctor must
        # still COMPLETE (exit 0) and report FAILs rather than crash or lie.
        run: node scripts/cli.mjs doctor --json
